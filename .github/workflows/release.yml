name: Release Godaddy Webhook Helm Chart

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract release version
        id: version
        run: |
          RELEASE_VERSION=$(yq '.current-version' .github/project.yml)
          NEXT_VERSION=$(yq '.next-version' .github/project.yml)
          echo "release=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "next=${NEXT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${RELEASE_VERSION}"
          echo "Next version: ${NEXT_VERSION}"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: snowdrop/cert-manager-webhook-godaddy
          tags: ${{ steps.version.outputs.release }}, latest
          enableBuildKit: true
          multiPlatform: true
          platform: linux/amd64,linux/arm64
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.5.0
        with:
          charts_dir: deploy/charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Tag the release
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.release }}"
          git tag v${RELEASE_VERSION}
          git push origin v${RELEASE_VERSION}

      - name: Set next development version
        run: |
          NEXT_VERSION="${{ steps.version.outputs.next }}"

          export TAG_VERSION=${NEXT_VERSION}
          yq '.appVersion = env(TAG_VERSION)' -i ./deploy/charts/godaddy-webhook/Chart.yaml
          yq '.version = env(TAG_VERSION)' -i ./deploy/charts/godaddy-webhook/Chart.yaml
          yq '.image.tag = env(TAG_VERSION)' -i ./deploy/charts/godaddy-webhook/values.yaml

          git commit -asm "chore: set next development version to ${NEXT_VERSION}"
          git push origin main

      - name: Cleanup release branch
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.release }}"
          git push origin --delete release/${RELEASE_VERSION} || true